<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://unpkg.com/aframe-chromakey-material/dist/aframe-chromakey-material.min.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #welcome {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #111;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
    }

    #welcome h1 {
      font-size: 32px;
    }

    #welcome p {
      font-size: 18px;
      line-height: 1.5;
    }

    #startAR {
      margin-top: 30px;
      padding: 18px 45px;
      font-size: 20px;
      border-radius: 12px;
      border: none;
    }

    #soundButton {
      position: fixed;
      z-index: 9999;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      padding: 15px 25px;
      font-size: 18px;
      border-radius: 12px;
      border: none;
    }
  </style>
</head>

<body>
  <div id="welcome">
    <h1>Welcome</h1>
    <p>
      Experience this AR animation.<br><br>
      Tap Start AR and point your camera<br>
      at the image target.
    </p>
    <button id="startAR">
      Start AR
    </button>
  </div>
  <a-scene mindar-image="imageTargetSrc: nothing-changes-if-nothing-changes.mind;" color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">
    <a-assets>
      <video id="greenVideo" src="nothing-changes-if-nothing-changes.mp4" preload="auto" loop playsinline webkit-playsinline crossorigin="anonymous">
      </video>
    </a-assets>
    <a-camera position="0 0 0" look-controls="enabled:false">
    </a-camera>
    <a-entity id="target" mindar-image-target="targetIndex:0">
      <a-entity geometry="primitive: plane; width:1; height:1;" material="shader:chromakey; src:#greenVideo; color:0 1 0; transparent:true; side:double;">
      </a-entity>
    </a-entity>
  </a-scene>
  <script>
    const welcome = document.querySelector("#welcome");
    const startButton = document.querySelector("#startAR");
    const video = document.querySelector("#greenVideo");
    const target = document.querySelector("#target");
    // User enters AR
    startButton.addEventListener("click", async () => {
      welcome.style.display = "none";
      // Unlock audio on iOS Safari
      try {
        video.muted = false;
        video.volume = 1;
        await video.play();
        video.pause();
        video.currentTime = 0;
      }
      catch (e) {
        console.log("Audio unlock waiting");
      }
    });
    // Image found
    target.addEventListener("targetFound", async () => {
      console.log("Target found");
      try {
        video.currentTime = 0;
        video.muted = false;
        video.volume = 1;
        await video.play();
      }
      catch (e) {
        console.log("Sound blocked");
        video.muted = true;
        await video.play();
        showSoundButton();
      }
    });
    // Image lost
    target.addEventListener("targetLost", () => {
      console.log("Target lost");
      video.pause();
    });
    function showSoundButton() {
      if (document.querySelector("#soundButton"))
        return;
      const button = document.createElement("button");
      button.id = "soundButton";
      button.innerHTML = "🔊 Enable Sound";
      document.body.appendChild(button);
      button.onclick = async () => {
        try {
          video.muted = false;
          video.volume = 1;
          await video.play();
          button.remove();
        }
        catch (e) {
          console.error(e);
        }
      };
    }
  </script>
</body>

</html>
