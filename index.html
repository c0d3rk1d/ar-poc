<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://unpkg.com/aframe-chromakey-material/dist/aframe-chromakey-material.min.js"></script>
  <style>
    #startButton {
      position: fixed;
      z-index: 9999;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 18px 35px;
      font-size: 20px;
      border-radius: 12px;
      border: none;
      background: #ffffff;
      color: #000000;
    }
  </style>
</head>

<body>
  <button id="startButton">
    Start AR
  </button>
  <a-scene mindar-image="imageTargetSrc: nothing-changes-if-nothing-changes.mind;" color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true" vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <a-assets>
      <video id="greenVideo" src="nothing-changes-if-nothing-changes.mp4" preload="auto" loop playsinline
        webkit-playsinline crossorigin="anonymous">
      </video>
    </a-assets>
    <a-camera position="0 0 0" look-controls="enabled:false">
    </a-camera>
    <a-entity id="target" mindar-image-target="targetIndex:0">
      <a-entity geometry="primitive: plane; width: 1.1; height: 1.1" material="
        shader: chromakey;
        src: #greenVideo;
        color: 0.0 1.0 0.0;
        transparent: true;
        side: double">
      </a-entity>
    </a-entity>
  </a-scene>
  <script>
    const video = document.querySelector("#greenVideo");
    const target = document.querySelector("#target");
    const startButton = document.querySelector("#startButton");
    let audioUnlocked = false;
    // User gesture required by iOS Safari
    startButton.addEventListener("click", async () => {
      try {
        video.muted = false;
        video.volume = 0.05;
        // Unlock video/audio permission
        await video.play();
        video.pause();
        video.currentTime = 0;
        audioUnlocked = true;
        startButton.style.display = "none";
        console.log("Audio unlocked");
      } catch (e) {
        console.error("Audio unlock failed", e);
      }
    });
    // Start video when target appears
    target.addEventListener("targetFound", async () => {
      console.log("Target found");
      try {
        if (!audioUnlocked) {
          video.muted = true;
        } else {
          video.muted = false;
          video.volume = 1;
        }
        video.currentTime = 0;
        await video.play();
      } catch (e) {
        console.error(e);
      }
    });
    // Pause when target disappears
    target.addEventListener("targetLost", () => {
      console.log("Target lost");
      video.pause();
    });
  </script>
</body>

</html>
