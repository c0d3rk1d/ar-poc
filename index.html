<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>
  <a-scene mindar-image="imageTargetSrc: ./nothing-changes-if-nothing-changes.mind;" vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <a-assets>
      <!-- Ensure your video is muted, inline, and cross-origin allowed for autoplay -->
      <video id="greenscreen-video" src="./nothing-changes-if-nothing-changes.mp4" loop="true" autoplay="true" muted="false" playsinline crossorigin="anonymous"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- MindAR Target Link -->

    <!-- Apply the custom shader here -->
    <a-plane position="0 0 0" rotation="0 0 0" width="1" height="0.56"
      material="shader: chromakey; src: #greenscreen-video; color: 0.0 1.0 0.0; threshold: 0.3">
    </a-plane>

  </a-scene>

</body>

</html>
